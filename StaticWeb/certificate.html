          <div class="cert-item">
            <img src="#" alt="Certificate 10">

      </div>
    </div>
  </div>

  <script>
    // Animasi masuk bertahap
    document.addEventListener('DOMContentLoaded', () => {
      const title = document.querySelector('.section-title');
      const divider = document.querySelector('.divider');
      const certGrid = document.querySelector('.certificates-grid');

      setTimeout(() => title.classList.add('animate-in'), 200);
      setTimeout(() => divider.classList.add('animate-in'), 500);
      setTimeout(() => certGrid.classList.add('animate-in'), 700);
    });
  </script>
</body>
